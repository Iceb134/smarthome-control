<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narongrit's Smart Home</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #ffffff;
            min-height: 100vh;
        }
        
        .toggle-checkbox:checked {
            right: 0;
            border-color: #3b82f6;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #3b82f6;
        }
        
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="p-6 md:p-12 flex flex-col items-center">

    <!-- ส่วนหัว (Header) -->
    <header class="w-full max-w-3xl flex justify-between items-center mb-8">
        <div>
            <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-teal-300">
                Narongrit's Smart Home
            </h1>
            <p class="text-gray-400 mt-1">แผงควบคุมระบบบ้านอัจฉริยะส่วนตัว</p>
        </div>
        <div class="h-12 w-12 rounded-full bg-blue-500/20 flex items-center justify-center border border-blue-500/50">
            <i class="fas fa-home text-blue-400 text-xl"></i>
        </div>
    </header>

    <!-- การแสดงผลเซ็นเซอร์ LDR -->
    <section class="w-full max-w-3xl mb-8">
        <div class="glass-card rounded-2xl p-6 flex flex-col md:flex-row items-center justify-between shadow-xl gap-4">
            <div class="flex items-center gap-4 w-full md:w-auto">
                <div id="env-icon-container" class="h-16 w-16 min-w-[64px] rounded-full bg-gray-800 flex items-center justify-center">
                    <i id="env-icon" class="fas fa-spinner fa-spin text-gray-400 text-3xl"></i>
                </div>
                <div>
                    <h2 class="text-sm text-gray-400">สถานะแสงสภาพแวดล้อม</h2>
                    <p id="env-status" class="text-xl md:text-2xl font-semibold mt-1">กำลังโหลดข้อมูล...</p>
                </div>
            </div>
            
            <!-- กล่องแสดงค่า Digital LDR 1/0 -->
            <div class="bg-gray-800/60 border border-gray-600 rounded-xl px-5 py-3 flex items-center gap-3 w-full md:w-auto justify-center">
                <i class="fas fa-microchip text-gray-400"></i>
                <div class="flex flex-col">
                    <span class="text-xs text-gray-400 uppercase tracking-wider">LDR State</span>
                    <div class="text-lg font-bold">
                        <span id="ldr-raw-value" class="text-blue-400 text-2xl">-</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- ปุ่มควบคุมอุปกรณ์ 4 โซน (อัปเดตสลับตำแหน่ง Light 1 และ Light 2) -->
    <section class="w-full max-w-3xl grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <div class="glass-card rounded-2xl p-6 flex justify-between items-center shadow-lg transition-transform hover:scale-[1.02]">
            <div class="flex items-center gap-4">
                <i id="icon-Light1" class="fas fa-lightbulb text-2xl text-gray-500 transition-colors"></i>
                <div>
                    <h3 class="font-semibold text-lg">ไฟห้องพัดลม</h3>
                    <p class="text-xs text-gray-400">Light 1 Control</p>
                </div>
            </div>
            <div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                <input type="checkbox" id="toggle-Light1" onchange="toggleDevice('Light1', this.checked)" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 border-gray-600 appearance-none cursor-pointer z-10 transition-all duration-300"/>
                <label for="toggle-Light1" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-600 cursor-pointer transition-colors duration-300"></label>
            </div>
        </div>

        <div class="glass-card rounded-2xl p-6 flex justify-between items-center shadow-lg transition-transform hover:scale-[1.02]">
            <div class="flex items-center gap-4">
                <i id="icon-Light2" class="fas fa-tv text-2xl text-gray-500 transition-colors"></i>
                <div>
                    <h3 class="font-semibold text-lg">ไฟห้องทีวี</h3>
                    <p class="text-xs text-gray-400">Light 2 Control</p>
                </div>
            </div>
            <div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                <input type="checkbox" id="toggle-Light2" onchange="toggleDevice('Light2', this.checked)" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 border-gray-600 appearance-none cursor-pointer z-10 transition-all duration-300"/>
                <label for="toggle-Light2" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-600 cursor-pointer transition-colors duration-300"></label>
            </div>
        </div>

        <div class="glass-card rounded-2xl p-6 flex justify-between items-center shadow-lg transition-transform hover:scale-[1.02]">
            <div class="flex items-center gap-4">
                <i id="icon-Light3" class="fas fa-door-open text-2xl text-gray-500 transition-colors"></i>
                <div>
                    <h3 class="font-semibold text-lg">ไฟประตูหน้า</h3>
                    <p class="text-xs text-gray-400">Light 3 Control</p>
                </div>
            </div>
            <div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                <input type="checkbox" id="toggle-Light3" onchange="toggleDevice('Light3', this.checked)" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 border-gray-600 appearance-none cursor-pointer z-10 transition-all duration-300"/>
                <label for="toggle-Light3" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-600 cursor-pointer transition-colors duration-300"></label>
            </div>
        </div>

        <div class="glass-card rounded-2xl p-6 flex justify-between items-center shadow-lg transition-transform hover:scale-[1.02]">
            <div class="flex items-center gap-4">
                <i id="icon-Fan" class="fas fa-fan text-2xl text-gray-500 transition-colors"></i>
                <div>
                    <h3 class="font-semibold text-lg">ระบบพัดลมส่าย</h3>
                    <p class="text-xs text-gray-400">Servo Sweep Control</p>
                </div>
            </div>
            <div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                <input type="checkbox" id="toggle-Fan" onchange="toggleDevice('Fan', this.checked)" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 border-gray-600 appearance-none cursor-pointer z-10 transition-all duration-300"/>
                <label for="toggle-Fan" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-600 cursor-pointer transition-colors duration-300"></label>
            </div>
        </div>

    </section>

    <!-- โค้ดเชื่อมต่อ Firebase V10 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDWKD0HXaT35DjB-yyGSEEW3wMC3P2zgi4",
            databaseURL: "https://smarthome-c7e59-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.toggleDevice = function(device, isChecked) {
            const value = isChecked ? 1 : 0;
            set(ref(db, 'Home/' + device), value);
        };

        const devices = ['Light1', 'Light2', 'Light3', 'Fan'];
        
        devices.forEach(device => {
            onValue(ref(db, 'Home/' + device), (snapshot) => {
                const val = snapshot.val();
                const checkbox = document.getElementById(`toggle-${device}`);
                const icon = document.getElementById(`icon-${device}`);
                
                if (checkbox) checkbox.checked = (val === 1);
                
                if (val === 1) {
                    icon.classList.add('text-blue-400');
                    icon.classList.remove('text-gray-500');
                    if(device === 'Fan') icon.classList.add('animate-spin');
                } else {
                    icon.classList.remove('text-blue-400');
                    icon.classList.add('text-gray-500');
                    if(device === 'Fan') icon.classList.remove('animate-spin');
                }
            });
        });

        onValue(ref(db, 'Home/isNight'), (snapshot) => {
            const isNight = snapshot.val();
            const envStatus = document.getElementById('env-status');
            const envIcon = document.getElementById('env-icon');
            
            if (isNight === true) {
                envStatus.innerText = "กลางคืน (โหมดมืด)";
                envStatus.className = "text-xl md:text-2xl font-semibold mt-1 text-indigo-300";
                envIcon.className = "fas fa-moon text-yellow-300 text-3xl";
            } else {
                envStatus.innerText = "กลางวัน (สว่าง)";
                envStatus.className = "text-xl md:text-2xl font-semibold mt-1 text-orange-300";
                envIcon.className = "fas fa-sun text-orange-400 text-3xl animate-pulse";
            }
        });

        onValue(ref(db, 'Home/ldrValue'), (snapshot) => {
            const ldrVal = snapshot.val();
            const rawValueDisplay = document.getElementById('ldr-raw-value');
            
            if (ldrVal !== null) {
                rawValueDisplay.innerText = ldrVal;
                if(ldrVal === 1) {
                    rawValueDisplay.className = "text-blue-400 text-2xl";
                } else {
                    rawValueDisplay.className = "text-orange-400 text-2xl";
                }
            }
        });
    </script>
</body>
</html>
